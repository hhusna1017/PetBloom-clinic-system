<div class="min-h-screen bg-[#eaf6f6] flex flex-col">

  <!-- Navbar -->
  <div id="navbar">
  <div>
    <a routerLink="/about-us" class="nav-link">About Us</a>
    <a routerLink="/services" class="nav-link">Service</a>
  </div>
  <div id="logo-area">
    <div id="logo-icon">🐾</div>
    <div id="logo-text">
      PetBloom
      <span>Veterinary</span>
    </div>
  </div>
</div>
  <!-- Main -->
  <main class="flex-1 flex items-center justify-center px-5 py-10">

    <!-- Registration Card -->
    <div class="w-full max-w-[950px] min-h-[550px] bg-white rounded-[20px] overflow-hidden shadow-[0_10px_40px_rgba(0,0,0,0.08)] flex flex-col md:flex-row">

      <!-- FORM SIDE -->
      <div class="w-full md:w-1/2 p-7 md:p-10 flex flex-col justify-center">

        <!-- Title -->
        <h2 class="text-[#004d61] text-[22px] font-bold mb-5 tracking-wide" style="font-family: 'Playfair Display', serif;">
          PET OWNER REGISTRATION
        </h2>

        <!-- Form Container -->
        <div class="bg-[#a2ebd8] rounded-[15px] p-6">
          <form class="space-y-3">

            <!-- Name -->
            <div>
              <label class="block text-[#1c4a44] font-bold text-[11px] uppercase tracking-[0.8px] mb-1">
                Name
              </label>
              <input
                type="text"
                placeholder="Enter your full name"
                class="w-full px-[18px] py-[10px] bg-white rounded-full border-2 border-transparent outline-none text-sm text-[#333] focus:border-[#007a87] focus:ring-4 focus:ring-[#007a87]/15"
              />
            </div>

            <!-- Phone Number -->
            <div>
              <label class="block text-[#1c4a44] font-bold text-[11px] uppercase tracking-[0.8px] mb-1">
                Phone Number
              </label>
              <input
                type="text"
                placeholder="e.g., 0123456789"
                class="w-full px-[18px] py-[10px] bg-white rounded-full border-2 border-transparent outline-none text-sm text-[#333] focus:border-[#007a87] focus:ring-4 focus:ring-[#007a87]/15"
              />
            </div>

            <!-- Address -->
            <div>
              <label class="block text-[#1c4a44] font-bold text-[11px] uppercase tracking-[0.8px] mb-1">
                Address
              </label>
              <input
                type="text"
                placeholder="Enter your residential address"
                class="w-full px-[18px] py-[10px] bg-white rounded-full border-2 border-transparent outline-none text-sm text-[#333] focus:border-[#007a87] focus:ring-4 focus:ring-[#007a87]/15"
              />
            </div>

            <!-- Email -->
            <div>
              <label class="block text-[#1c4a44] font-bold text-[11px] uppercase tracking-[0.8px] mb-1">
                Email Address
              </label>
              <input
                type="email"
                placeholder="username@example.com"
                class="w-full px-[18px] py-[10px] bg-white rounded-full border-2 border-transparent outline-none text-sm text-[#333] focus:border-[#007a87] focus:ring-4 focus:ring-[#007a87]/15"
              />
            </div>

            <!-- Password -->
            <div>
              <label class="block text-[#1c4a44] font-bold text-[11px] uppercase tracking-[0.8px] mb-1">
                Password
              </label>
              <input
                type="password"
                placeholder="Create a password"
                class="w-full px-[18px] py-[10px] bg-white rounded-full border-2 border-transparent outline-none text-sm text-[#333] focus:border-[#007a87] focus:ring-4 focus:ring-[#007a87]/15"
              />
            </div>

            <!-- Bottom Action -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mt-5">
              <a routerLink="/login" class="text-xs text-[#004d61] underline font-bold hover:text-[#002b36]">
  Already have an account? Sign In
</a>

              <button
                type="button"
                class="bg-[#008ba3] text-white px-8 py-2.5 rounded-full font-bold text-[13px] uppercase tracking-wide shadow-[0_4px_12px_rgba(0,139,163,0.35)] hover:bg-[#00687a] hover:-translate-y-[1px] transition-all duration-200"
              >
                Register
              </button>
            </div>

          </form>
        </div>

      </div>

      <!-- IMAGE SIDE -->
      <div class="w-full md:w-1/2 h-[250px] md:h-auto overflow-hidden order-first md:order-last">
        <img
          src="https://mixlab.com/hubfs/shutterstock_2485692303.jpg"
          alt="Veterinarian with dog"
          class="w-full h-full object-cover hover:scale-[1.03] transition-transform duration-500"
        />
      </div>

    </div>

  </main>

  <footer>
  &copy; 2026 PetBloom Animal Clinic &nbsp;|&nbsp; No. 8, Jalan Telawi 3, Bangsar Baru, 59100 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur &nbsp;|&nbsp; 06-123 4567
</footer>

</div>
